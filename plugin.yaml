name: clickclack-platform
label: ClickClack
kind: platform
version: 0.1.0
description: >
  ClickClack gateway adapter for Hermes Agent.
  Connects to a self-hosted ClickClack server with a bot token over the REST
  API + realtime WebSocket and relays messages between ClickClack channels,
  DMs and threads and the Hermes agent. Supports mention gating, file
  uploads, typing indicators, the bot command menu and home-channel cron
  delivery.
author: jig
requires_env:
  - name: CLICKCLACK_URL
    description: "ClickClack server URL (e.g. http://127.0.0.1:8080)"
    prompt: "ClickClack server URL"
    password: false
  - name: CLICKCLACK_TOKEN
    description: "Bot token (ccb_...) from `clickclack admin bot create`"
    prompt: "ClickClack bot token"
    password: true
optional_env:
  - name: CLICKCLACK_ALLOWED_USERS
    description: "Comma-separated ClickClack user IDs (usr_...) allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: CLICKCLACK_ALLOW_ALL_USERS
    description: "Allow any workspace member to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: CLICKCLACK_HOME_CHANNEL
    description: "Default channel (chn_...) or DM (dm_...) ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: CLICKCLACK_REPLY_MODE
    description: "How replies to top-level channel posts are sent: 'thread' or 'off' (flat). Default: off."
    prompt: "Reply mode (thread|off)"
    password: false
  - name: CLICKCLACK_REQUIRE_MENTION
    description: "Require @bot mention in channels (default true)."
    prompt: "Require @mention? (true/false)"
    password: false
  - name: CLICKCLACK_FREE_RESPONSE_CHANNELS
    description: "Comma-separated channel IDs where @mention is not required."
    prompt: "Free-response channel IDs (comma-separated)"
    password: false
  - name: CLICKCLACK_ALLOWED_CHANNELS
    description: "If set, the bot only responds in these channels (whitelist)."
    prompt: "Allowed channel IDs (comma-separated)"
    password: false
